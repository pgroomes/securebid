<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Dashboard Demo</title><style>
:root{--bg:#08111f;--panel:#101b2e;--panel2:#16243a;--line:#263a5a;--text:#eef5ff;--muted:#9eb0c9;--accent:#4fd1c5;--accent2:#6aa8ff;--ok:#58d68d;--warn:#ffc857;--danger:#ff6b6b}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:linear-gradient(180deg,#07101c,#0b1525);color:var(--text)}
.app{max-width:720px;margin:auto;min-height:100vh;padding:14px}
header{display:flex;align-items:center;gap:11px;margin-bottom:14px}
.logo{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#06101c;font-weight:900;flex:0 0 auto}
h1,h2,h3,p{margin-top:0}.sub{color:var(--muted);font-size:13px;line-height:1.45}
.card{background:rgba(16,27,46,.97);border:1px solid var(--line);border-radius:17px;padding:15px;margin-bottom:13px;box-shadow:0 15px 42px rgba(0,0,0,.24)}
.btn{width:100%;border:0;border-radius:12px;padding:13px 14px;background:#243856;color:var(--text);font-weight:800;margin-top:9px}
.btn.primary{background:linear-gradient(135deg,var(--accent),#2eb7aa);color:#06110f}
.btn.secondary{background:linear-gradient(135deg,var(--accent2),#4c7de0)}
.btn.ok{background:var(--ok);color:#07160e}.btn.warn{background:var(--warn);color:#211500}.btn.danger{background:var(--danger);color:#230809}
.metric{padding:14px;border-radius:14px;background:#132137;border:1px solid var(--line);margin-bottom:10px}
.metric .label{font-size:12px;color:var(--muted)}.metric .value{font-size:27px;font-weight:900;margin-top:3px}
.row{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);align-items:center}
.pill{display:inline-block;padding:5px 8px;border-radius:999px;background:#223552;font-size:12px;font-weight:800}
input,select,textarea{width:100%;background:#0c1728;color:var(--text);border:1px solid var(--line);border-radius:11px;padding:12px;font:inherit}
label{display:block;color:var(--muted);font-size:13px;margin:11px 0 6px}
textarea{min-height:90px}
.event{border-left:3px solid var(--accent2);padding:10px 12px;background:#101a2c;border-radius:0 11px 11px 0;margin-bottom:9px}
.event small{color:var(--muted)}
.deal{background:#17263d;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.quote{background:#fff;color:#172033;border-radius:14px;padding:18px}
.quote table{width:100%;border-collapse:collapse}.quote th,.quote td{padding:10px 6px;border-bottom:1px solid #d8e0ea;text-align:left}.quote td:last-child,.quote th:last-child{text-align:right}
.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:10px}
.file{background:#111d31;border:1px solid var(--line);border-radius:11px;overflow:hidden}.file img{width:100%;height:115px;object-fit:cover}.file div{padding:8px;font-size:12px;overflow-wrap:anywhere}
.back{display:inline-block;color:var(--accent);text-decoration:none;font-weight:800;margin-bottom:12px}
.toast{position:fixed;left:14px;right:14px;bottom:14px;background:#0d192a;border:1px solid var(--accent);border-radius:12px;padding:13px;display:none;text-align:center}
@media(min-width:600px){.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{margin:0}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions .btn{margin-top:9px}}
</style></head><body><div class="app"><a class="back" href="index.html">← All CRM demos</a><header><div class="logo">SB</div><div><h1 style="margin-bottom:3px">Dashboard Demo</h1><div class="sub">SecureBid mobile CRM demonstration</div></div></header>
<div class="metrics">
<div class="metric"><div class="label">Open Pipeline</div><div class="value">$60,400</div></div>
<div class="metric"><div class="label">Quotes Sent</div><div class="value">6</div></div>
<div class="metric"><div class="label">Customers</div><div class="value">14</div></div>
<div class="metric"><div class="label">Accepted Revenue</div><div class="value">$41,200</div></div>
</div>
<div class="card"><h2>Recent Activity</h2>
<div class="event"><strong>Quote accepted</strong><div>Northstar Foods accepted SB-2026-1042.</div><small>Today, 10:42 AM</small></div>
<div class="event"><strong>Follow-up call</strong><div>Spoke with Summit Medical Group.</div><small>Yesterday, 3:15 PM</small></div>
<button class="btn primary" onclick="toast('Dashboard metrics refreshed.')">Refresh Dashboard</button></div>
</div><div id="toast" class="toast"></div><script>
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';setTimeout(()=>t.style.display='none',2400)}
function money(n){return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(n)}
</script></body></html>
