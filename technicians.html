<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Technician Profiles</title><style>
:root{--bg:#08111f;--panel:#101b2e;--panel2:#16243a;--line:#263a5a;--text:#eef5ff;--muted:#9eb0c9;--accent:#4fd1c5;--accent2:#6aa8ff;--ok:#58d68d;--warn:#ffc857;--danger:#ff6b6b}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:linear-gradient(180deg,#07101c,#0b1525);color:var(--text)}
.app{max-width:820px;margin:auto;min-height:100vh;padding:14px}
header{display:flex;align-items:center;gap:11px;margin-bottom:14px}
.logo{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#06101c;font-weight:900;flex:0 0 auto}
h1,h2,h3,p{margin-top:0}.sub{color:var(--muted);font-size:13px;line-height:1.45}
.card{background:rgba(16,27,46,.97);border:1px solid var(--line);border-radius:17px;padding:15px;margin-bottom:13px;box-shadow:0 15px 42px rgba(0,0,0,.24)}
.btn{width:100%;border:0;border-radius:12px;padding:13px 14px;background:#243856;color:var(--text);font-weight:800;margin-top:9px;text-decoration:none;display:block;text-align:center}
.btn.primary{background:linear-gradient(135deg,var(--accent),#2eb7aa);color:#06110f}
.btn.secondary{background:linear-gradient(135deg,var(--accent2),#4c7de0)}
.btn.ok{background:var(--ok);color:#07160e}.btn.warn{background:var(--warn);color:#211500}.btn.danger{background:var(--danger);color:#230809}
.row{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);align-items:center}
.pill{display:inline-block;padding:5px 8px;border-radius:999px;background:#223552;font-size:12px;font-weight:800}
input,select,textarea{width:100%;background:#0c1728;color:var(--text);border:1px solid var(--line);border-radius:11px;padding:12px;font:inherit}
label{display:block;color:var(--muted);font-size:13px;margin:11px 0 6px}
textarea{min-height:90px}
.back{display:inline-block;color:var(--accent);text-decoration:none;font-weight:800;margin-bottom:12px}
.toast{position:fixed;left:14px;right:14px;bottom:14px;background:#0d192a;border:1px solid var(--accent);border-radius:12px;padding:13px;display:none;text-align:center}
.demo-link{display:block;text-decoration:none;color:var(--text);background:#132137;border:1px solid var(--line);border-radius:15px;padding:15px;margin-bottom:11px}
.demo-link strong{display:block;font-size:18px;margin-bottom:4px}.demo-link span{color:var(--muted);font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.metric{background:#132137;border:1px solid var(--line);border-radius:14px;padding:14px}
.metric .label{font-size:12px;color:var(--muted)}.metric .value{font-size:24px;font-weight:900;margin-top:4px}
.item{background:#111d31;border:1px solid var(--line);border-radius:13px;padding:12px;margin-bottom:10px}
.item strong{display:block;margin-bottom:4px}
.profile{display:grid;grid-template-columns:88px 1fr;gap:12px;align-items:start}
.avatar{width:88px;height:88px;border-radius:18px;background:#20324d;object-fit:cover;display:grid;place-items:center;font-size:28px;font-weight:900}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{background:#223552;border-radius:999px;padding:5px 8px;font-size:11px}
.filelist{display:grid;gap:8px;margin-top:10px}
.fileitem{background:#0c1728;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}.profile{grid-template-columns:1fr}.avatar{width:76px;height:76px}}
</style></head><body><div class="app"><a class="back" href="index.html">← All CRM demos</a><header><div class="logo">WO</div><div><h1 style="margin-bottom:3px">Technician Profiles</h1><div class="sub">Internal operations module — separate from customer CRM</div></div></header>
<div class="card">
  <h2>Technician Profile Builder</h2>
  <p class="sub">Create detailed internal profiles used for scheduling, costing, assignments, and compliance.</p>

  <div class="grid2">
    <div><label>Full Name</label><input id="tName" value="Alex Ramirez"></div>
    <div><label>Employee / Contractor ID</label><input id="tEmployeeId" value="TECH-001"></div>
  </div>

  <div class="grid2">
    <div><label>Role / Trade</label><input id="tTrade" value="Lead Security Technician"></div>
    <div><label>Employment Type</label><select id="tType"><option>Employee</option><option>1099 Contractor</option><option>Temporary</option></select></div>
  </div>

  <div class="grid2">
    <div><label>Phone</label><input id="tPhone" value="(555) 010-2201"></div>
    <div><label>Email</label><input id="tEmail" type="email" value="alex.ramirez@example.com"></div>
  </div>

  <div class="grid2">
    <div><label>Home Base / Territory</label><input id="tTerritory" value="Tampa Bay"></div>
    <div><label>Availability</label><select id="tAvailability"><option>Available</option><option>Assigned</option><option>Off Duty</option><option>On Leave</option></select></div>
  </div>

  <label>Skills</label>
  <input id="tSkills" value="Access Control, CCTV, Fire Alarm, Networking">

  <label>Certifications / Licenses</label>
  <input id="tCerts" value="NICET II, OSHA 10, Manufacturer Certified">

  <div class="grid2">
    <div><label>Base Cost / Hour</label><input id="tCost" type="number" step="0.01" value="38"></div>
    <div><label>Internal Bill Rate / Hour</label><input id="tBill" type="number" step="0.01" value="85"></div>
  </div>

  <div class="grid2">
    <div><label>Emergency Contact</label><input id="tEmergencyName" value="Maria Ramirez"></div>
    <div><label>Emergency Contact Phone</label><input id="tEmergencyPhone" value="(555) 010-2299"></div>
  </div>

  <label>Notes</label>
  <textarea id="tNotes">Lead field technician with strong access-control and commissioning experience.</textarea>

  <label>Profile Photo</label>
  <input id="tPhoto" type="file" accept="image/*">

  <label>Technician Documents</label>
  <input id="tDocs" type="file" multiple accept=".pdf,.doc,.docx,.jpg,.jpeg,.png">

  <button class="btn primary" onclick="saveTechnician()">Save Technician Profile</button>
</div>

<div class="card">
  <h2>Technician Directory</h2>
  <div id="techDirectory"></div>
</div>

<div class="card">
  <h2>Assignment History Demo</h2>
  <label>Select Technician</label>
  <select id="historyTech"></select>
  <label>Work Order</label>
  <input id="historyWO" value="WO-1001">
  <label>Assignment Note</label>
  <textarea id="historyNote">Assigned as lead technician for camera expansion.</textarea>
  <button class="btn secondary" onclick="addHistory()">Add Assignment Record</button>
</div>
</div><div id="toast" class="toast"></div><script>
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';setTimeout(()=>t.style.display='none',2400)}
function money(n){return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Number(n||0))}
function getWO(){return JSON.parse(localStorage.getItem('securebid_workorders')||'{"orders":[],"techs":[]}')}
function setWO(data){localStorage.setItem('securebid_workorders',JSON.stringify(data))}

let state=getWO();
let currentPhoto='';
let currentDocs=[];

if(!state.techs||!state.techs.length){
  state.techs=[
    {
      id:1,name:'Alex Ramirez',employeeId:'TECH-001',trade:'Lead Security Technician',type:'Employee',
      phone:'(555) 010-2201',email:'alex.ramirez@example.com',territory:'Tampa Bay',availability:'Available',
      skills:['Access Control','CCTV','Fire Alarm','Networking'],
      certs:['NICET II','OSHA 10','Manufacturer Certified'],
      cost:38,bill:85,emergencyName:'Maria Ramirez',emergencyPhone:'(555) 010-2299',
      notes:'Lead field technician with strong access-control and commissioning experience.',
      photo:'',docs:[],history:[{date:new Date().toLocaleString(),wo:'WO-1001',note:'Assigned as lead technician for camera expansion.'}]
    }
  ];
  setWO(state);
}

tPhoto.addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f)return;
  const r=new FileReader(); r.onload=()=>{currentPhoto=r.result;toast('Profile photo loaded.');}; r.readAsDataURL(f);
});
tDocs.addEventListener('change',e=>{
  currentDocs=[...e.target.files].map(f=>({name:f.name,type:f.type||'file'}));
  toast(currentDocs.length+' document(s) selected.');
});

function saveTechnician(){
  const name=tName.value.trim(); if(!name)return toast('Enter technician name.');
  const tech={
    id:Date.now(),name,employeeId:tEmployeeId.value.trim(),trade:tTrade.value.trim(),type:tType.value,
    phone:tPhone.value.trim(),email:tEmail.value.trim(),territory:tTerritory.value.trim(),availability:tAvailability.value,
    skills:tSkills.value.split(',').map(x=>x.trim()).filter(Boolean),
    certs:tCerts.value.split(',').map(x=>x.trim()).filter(Boolean),
    cost:Number(tCost.value||0),bill:Number(tBill.value||0),
    emergencyName:tEmergencyName.value.trim(),emergencyPhone:tEmergencyPhone.value.trim(),
    notes:tNotes.value.trim(),photo:currentPhoto,docs:currentDocs.slice(),history:[]
  };
  state.techs.push(tech); setWO(state); render(); toast('Technician profile saved.');
}

function addHistory(){
  const tech=state.techs.find(t=>String(t.id)===historyTech.value);
  if(!tech)return toast('Select a technician.');
  tech.history=tech.history||[];
  tech.history.unshift({date:new Date().toLocaleString(),wo:historyWO.value.trim(),note:historyNote.value.trim()});
  setWO(state);render();toast('Assignment history updated.');
}

function removeTech(id){
  state.techs=state.techs.filter(t=>t.id!==id);setWO(state);render();toast('Technician removed.');
}

function render(){
  historyTech.innerHTML=state.techs.map(t=>'<option value="'+t.id+'">'+t.name+'</option>').join('');
  techDirectory.innerHTML=state.techs.map(t=>{
    const initials=t.name.split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase();
    const avatar=t.photo?'<img class="avatar" src="'+t.photo+'" alt="'+t.name+'">':'<div class="avatar">'+initials+'</div>';
    const skills=(t.skills||[]).map(s=>'<span class="tag">'+s+'</span>').join('');
    const certs=(t.certs||[]).map(s=>'<span class="tag">'+s+'</span>').join('');
    const docs=(t.docs||[]).map(d=>'<div class="fileitem">'+d.name+'</div>').join('');
    const history=(t.history||[]).map(h=>'<div class="fileitem"><strong>'+h.wo+'</strong><div>'+h.note+'</div><div class="sub">'+h.date+'</div></div>').join('');
    return '<div class="item"><div class="profile">'+avatar+'<div><div class="row"><div><strong>'+t.name+'</strong><div class="sub">'+t.trade+' · '+t.employeeId+'</div></div><span class="pill">'+t.availability+'</span></div><div>'+t.phone+' · '+t.email+'</div><div class="sub">'+t.territory+' · '+t.type+'</div><div class="tags">'+skills+'</div></div></div><div class="grid2" style="margin-top:12px"><div class="metric"><div class="label">Cost / Hour</div><div class="value">'+money(t.cost)+'</div></div><div class="metric"><div class="label">Bill Rate / Hour</div><div class="value">'+money(t.bill)+'</div></div></div><div style="margin-top:12px"><span class="sub">Certifications</span><div class="tags">'+certs+'</div></div><div style="margin-top:12px"><span class="sub">Emergency Contact</span><div>'+t.emergencyName+' · '+t.emergencyPhone+'</div></div><div style="margin-top:12px"><span class="sub">Notes</span><div>'+t.notes+'</div></div>'+(docs?'<div style="margin-top:12px"><span class="sub">Documents</span><div class="filelist">'+docs+'</div></div>':'')+(history?'<div style="margin-top:12px"><span class="sub">Assignment History</span><div class="filelist">'+history+'</div></div>':'')+'<button class="btn danger" onclick="removeTech('+t.id+')">Remove Technician</button></div>';
  }).join('');
}
render();
</script></body></html>
